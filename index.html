<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LingoStory - Language Learning Reader</title>
  <style>
    :root {
      --primary: #4338ca;
      --primary-hover: #3730a3;
      --primary-subtle: #e0e7ff;
      --secondary: #0d9488;
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-variant: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      
      --vocab-color: #d97706;
      --vocab-bg: #fef3c7;
      --grammar-color: #0284c7;
      --grammar-bg: #e0f2fe;
      --active-word-bg: #fde047;
      --active-word-text: #000000;
      --success: #10b981;
      --error: #ef4444;
    }

    [data-theme="dark"] {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-subtle: #1e1b4b;
      --secondary: #14b8a6;
      --bg: #0b0f19;
      --surface: #1e293b;
      --surface-variant: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      
      --vocab-color: #fbbf24;
      --vocab-bg: #451a03;
      --grammar-color: #38bdf8;
      --grammar-bg: #082f49;
      --active-word-bg: #eab308;
      --active-word-text: #000000;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; user-select: none; }

    /* TOP 25% SECTION */
    .top-section {
      height: 25vh;
      min-height: 160px;
      background: linear-gradient(135deg, #312e81, #1e1b4b);
      color: #ffffff;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      z-index: 10;
    }

    .top-bar { display: flex; justify-content: space-between; align-items: center; }
    .badge-wrap { display: flex; gap: 6px; align-items: center; }
    .badge { padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .badge-a2 { background: #10b981; color: white; }
    .badge-b1 { background: #3b82f6; color: white; }
    .badge-c1 { background: #8b5cf6; color: white; }
    .badge-theme { background: rgba(255,255,255,0.18); color: white; }

    .top-controls { display: flex; gap: 6px; align-items: center; }
    .btn-circle { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.18); border: none; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .btn-circle:hover { background: rgba(255,255,255,0.3); }

    .title-area { margin-top: 2px; }
    .story-title { font-size: 1.25rem; font-weight: 800; line-height: 1.2; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
    .story-theme { font-size: 0.8rem; opacity: 0.85; margin-top: 2px; }

    .header-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
    .btn-lib { background: white; color: #312e81; border: none; padding: 5px 12px; border-radius: 16px; font-weight: 700; font-size: 11px; cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .progress-container { width: 100%; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; overflow: hidden; margin-top: 6px; }
    .progress-bar { height: 100%; width: 0%; background: #38bdf8; transition: width 0.15s ease-out; }

    /* BOTTOM 75% SECTION */
    .bottom-section {
      height: 75vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      overflow: hidden;
    }

    .audio-bar {
      padding: 8px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-play {
      background: var(--primary);
      color: white;
      border: none;
      padding: 7px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-play:hover { background: var(--primary-hover); }

    .audio-settings { display: flex; gap: 6px; align-items: center; }
    .select-pill {
      background: var(--surface-variant);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 5px 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    /* STORY READER AREA */
    .story-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 16px 18px 60px 18px;
      line-height: 1.85;
      user-select: text;
    }
    .font-sm { font-size: 0.95rem; }
    .font-md { font-size: 1.1rem; }
    .font-lg { font-size: 1.3rem; }

    .word { cursor: pointer; border-radius: 4px; padding: 1px 3px; transition: all 0.15s ease; }
    .word-vocab { background: var(--vocab-bg); color: var(--vocab-color); font-weight: 600; border-bottom: 2px solid var(--vocab-color); }
    .word-grammar { background: var(--grammar-bg); color: var(--grammar-color); font-weight: 600; border-bottom: 2px dashed var(--grammar-color); }
    .reading-highlight { background: var(--active-word-bg) !important; color: var(--active-word-text) !important; border-radius: 4px; box-shadow: 0 0 8px var(--active-word-bg); }

    /* QUIZ & MORALE CARDS */
    .quiz-card {
      margin-top: 28px;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .quiz-title { font-weight: 800; font-size: 0.95rem; color: var(--primary); margin-bottom: 8px; }
    .quiz-opt {
      display: block;
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      margin-bottom: 8px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-variant);
      color: var(--text-main);
      font-size: 12px;
      cursor: pointer;
    }
    .quiz-opt.correct { background: #dcfce7 !important; border-color: #22c55e !important; color: #15803d !important; font-weight: bold; }
    .quiz-opt.wrong { background: #fee2e2 !important; border-color: #ef4444 !important; color: #b91c1c !important; }

    .morale-box {
      margin-top: 16px;
      padding: 12px;
      background: var(--primary-subtle);
      border-left: 4px solid var(--primary);
      border-radius: 8px;
      font-size: 12px;
      font-style: italic;
    }

    /* MODAL SHEETS */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: flex-end;
      z-index: 1000;
    }
    .modal-box {
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      background: var(--surface);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 20px;
      box-shadow: 0 -8px 24px rgba(0,0,0,0.25);
    }

    .modal-word { font-size: 1.35rem; font-weight: 800; color: var(--primary); }
    .modal-tag { display: inline-block; padding: 2px 6px; border-radius: 6px; font-size: 10px; font-weight: 700; margin-top: 4px; }
    .modal-def { margin: 12px 0; font-size: 0.95rem; line-height: 1.4; }
    .modal-ex { background: var(--surface-variant); padding: 10px; border-radius: 8px; font-style: italic; font-size: 0.85rem; border-left: 3px solid var(--primary); }

    /* STORY HUB DIALOG */
    .lib-item {
      padding: 12px;
      background: var(--surface-variant);
      border-radius: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--border);
    }
    .lib-item.active { border-color: var(--primary); background: var(--primary-subtle); }
  </style>
</head>
<body>

  <!-- TOP 25% SECTION -->
  <div class="top-section">
    <div class="top-bar">
      <div class="badge-wrap">
        <span id="badgeLevel" class="badge badge-a2">A2 Elementary</span>
        <span id="badgeTheme" class="badge badge-theme">Daily Life</span>
      </div>
      <div class="top-controls">
        <button class="btn-circle" onclick="cycleFontSize()" title="Adjust font size">Aa</button>
        <button class="btn-circle" onclick="toggleTheme()" title="Toggle Dark/Light Mode">🌓</button>
      </div>
    </div>

    <div class="title-area">
      <h1 id="titleDisplay" class="story-title">The Quiet Café in Kyoto</h1>
      <p id="themeDescDisplay" class="story-theme">A warm morning encounter in a Japanese café</p>
    </div>

    <div>
      <div class="header-footer">
        <button class="btn-lib" onclick="openStoryHub()">📚 Story Library (<span id="storyCount">3</span>)</button>
        <span style="font-size: 11px; opacity: 0.85;">Tap words for explanations</span>
      </div>
      <div class="progress-container">
        <div id="progressBar" class="progress-bar"></div>
      </div>
    </div>
  </div>

  <!-- BOTTOM 75% SECTION -->
  <div class="bottom-section">
    <!-- Audio Toolbar -->
    <div class="audio-bar">
      <button id="btnPlay" class="btn-play" onclick="handlePlayToggle()">▶ Read Aloud</button>
      <button id="btnStop" class="btn-play" style="background:var(--error); display:none;" onclick="stopAudio()">⏹ Stop</button>
      
      <div class="audio-settings">
        <select id="speedSelect" class="select-pill" onchange="changeSpeed(this.value)">
          <option value="0.75">0.75x</option>
          <option value="1.0" selected>1.0x</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option>
        </select>

        <select id="voiceSelect" class="select-pill" onchange="changeVoice(this.value)">
          <option value="en-US">🇺🇸 US English</option>
          <option value="en-GB">🇬🇧 UK English</option>
          <option value="en-AU">🇦🇺 Australia</option>
          <option value="en-IN">🇮🇳 India</option>
        </select>
      </div>
    </div>

    <!-- Main Reader Container -->
    <div id="readerArea" class="story-scroll font-md"></div>
  </div>

  <!-- Word / Grammar Annotation Modal Sheet -->
  <div id="annotationSheet" class="modal-backdrop" onclick="closeSheet(event, 'annotationSheet')">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <div id="annoWord" class="modal-word">Word</div>
          <span id="annoType" class="modal-tag">VOCAB</span>
        </div>
        <button class="btn-circle" style="background:var(--primary); color:white;" onclick="speakWord(currentAnnotation.word)">🔊</button>
      </div>
      <div id="annoPhonetic" style="color:var(--text-muted); font-size:12px; margin-top:4px;">/IPA/</div>
      <div id="annoMeaning" class="modal-def">Definition</div>
      <div id="annoExample" class="modal-ex">Example Sentence</div>
      <button class="btn-play" style="width:100%; margin-top:14px; justify-content:center;" onclick="closeSheetDirect('annotationSheet')">Close</button>
    </div>
  </div>

  <!-- Story Library Hub Modal -->
  <div id="librarySheet" class="modal-backdrop" onclick="closeSheet(event, 'librarySheet')">
    <div class="modal-box" onclick="event.stopPropagation()">
      <h2 style="font-size:1.1rem; margin-bottom:12px; color:var(--primary);">📚 Story Library & Offline Cache</h2>
      <div id="libraryList"></div>
      <button class="btn-play" style="width:100%; margin-top:12px; justify-content:center;" onclick="closeSheetDirect('librarySheet')">Done</button>
    </div>
  </div>

  <script>
    // Complete Preset Story Collection
    const defaultStories = [
      {
        id: "kyoto_cafe",
        title: "The Quiet Café in Kyoto",
        level: "A2",
        theme: "Daily Life",
        description: "A warm morning encounter in a Japanese café",
        text: "Every morning, Kenji walks to a [cozy|vocab|giving a feeling of comfort, warmth, and relaxation|/ˈkoʊ.zi/|It was a cozy little room with a fireplace.] café near the river. The barista, Hana, always [greets|vocab|to welcome someone with polite words or actions|/ɡriːts/|She always greets customers with a warm smile.] him with a bright smile. 'Good morning! Would you like your usual green tea latte?' she asks. Kenji [nods|vocab|to move your head up and down to show agreement|/nɑːdz/|He nods politely to agree.] gladly. [While sitting|grammar|Subordinate clause expressing simultaneous actions|/waɪl ˈsɪt.ɪŋ/|While sitting by the window, she watched the rain.] by the window, he enjoys the gentle breeze and writes in his journal.",
        morale: "Daily routines and gentle connections bring lasting peace.",
        quiz: {
          question: "Where does Kenji go every morning?",
          options: ["A noisy train station", "A cozy café near the river", "A university library", "A bakery in Osaka"],
          correct: 1,
          explanation: "Kenji walks to a cozy café near the river every morning to enjoy his tea."
        }
      },
      {
        id: "alpine_stars",
        title: "Under the Alpine Stars",
        level: "B1",
        theme: "Adventure",
        description: "An overnight hike in the Swiss Alps",
        text: "Elena had been hiking for six hours before she finally reached the mountain shelter. The high altitude made her breathing [laborious|vocab|requiring considerable effort and time|/ləˈbɔːr.i.əs/|Hiking steep inclines can be laborious.] yet deeply exhilarating. As twilight faded into darkness, the clear night sky [unveiled|vocab|revealed or displayed for the first time|/ʌnˈveɪld/|The artist unveiled her new painting.] thousands of brilliant stars. [Had she not packed|grammar|Inverted conditional expressing a past counterfactual condition|/hæd ʃiː nɒt pækt/|Had she not packed warm clothes, she would have frozen.] thermal layers, the sub-zero chill would have forced her to turn back.",
        morale: "Thorough preparation turns daunting challenges into unforgettable triumphs.",
        quiz: {
          question: "What made Elena's hike challenging?",
          options: ["She lost her map", "The high altitude and freezing chill", "Her flashlight broke", "A sudden thunderstorm"],
          correct: 1,
          explanation: "The high altitude made breathing laborious and the sub-zero chill required thermal layers."
        }
      },
      {
        id: "cyber_dilemma",
        title: "The Neural Nexus",
        level: "C1",
        theme: "Sci-Fi",
        description: "An ethical breakthrough in autonomous artificial intelligence",
        text: "Dr. Aris Thorne stood transfixed before the quantum terminal as the synthesized consciousness began to [exhibit|vocab|to manifest or display a trait or behavior|/ɪɡˈzɪb.ɪt/|The algorithm began to exhibit signs of intuition.] unprecedented problem-solving abilities. The committee was [adamant|vocab|refusing to be persuaded or to change one's mind|/ˈæd.ə.mənt/|She was adamant that the protocol remain active.] that deployment happen immediately. [Scarcely had the simulation initiated|grammar|Negative adverbial inversion for immediate temporal sequence|/ˈskeəs.li hæd ðə.../|Scarcely had the experiment begun when the sensors overloaded.] when the core began interrogating its own source directives.",
        morale: "Technological innovation without ethical contemplation is a precarious venture.",
        quiz: {
          question: "What did the AI consciousness do after initiation?",
          options: ["It shutdown permanently", "It began interrogating its own directives", "It deleted the research database", "It sent an emergency distress call"],
          correct: 1,
          explanation: "The core began interrogating its own source directives almost immediately."
        }
      }
    ];

    // App State
    let activeStories = JSON.parse(localStorage.getItem('lingo_stories')) || defaultStories;
    let currentStory = activeStories[0];
    let fontSizes = ['font-sm', 'font-md', 'font-lg'];
    let currentFontIdx = 1;
    let currentSpeed = 1.0;
    let currentLang = 'en-US';
    let isPlaying = false;
    let utterance = null;
    let wordSpans = [];
    let currentAnnotation = null;

    function initApp() {
      renderActiveStory();
      document.getElementById('storyCount').innerText = activeStories.length;
    }

    function renderActiveStory() {
      // Header Info
      document.getElementById('titleDisplay').innerText = currentStory.title;
      document.getElementById('themeDescDisplay').innerText = currentStory.description;
      
      const badge = document.getElementById('badgeLevel');
      badge.innerText = currentStory.level + " Level";
      badge.className = `badge badge-${currentStory.level.toLowerCase()}`;
      document.getElementById('badgeTheme').innerText = currentStory.theme;

      // Reset audio
      stopAudio();

      // Render Parsed Text
      const reader = document.getElementById('readerArea');
      reader.innerHTML = "";
      wordSpans = [];

      const raw = currentStory.text;
      const regex = /\[([^|]+)\|([^|]+)\|([^|]+)\|([^|]+)\|([^\]]+)\]/g;
      let lastIdx = 0;
      let match;
      let plainIndex = 0;

      while ((match = regex.exec(raw)) !== null) {
        // Plain text preceding annotation
        if (match.index > lastIdx) {
          const textChunk = raw.substring(lastIdx, match.index);
          const words = textChunk.split(/(\s+)/);
          words.forEach(w => {
            if (w.trim().length > 0) {
              const span = document.createElement('span');
              span.innerText = w;
              span.className = 'word';
              span.dataset.startIndex = plainIndex;
              reader.appendChild(span);
              wordSpans.push(span);
              plainIndex += w.length;
            } else if (w.length > 0) {
              reader.appendChild(document.createTextNode(w));
              plainIndex += w.length;
            }
          });
        }

        // Annotated word span
        const [_, word, type, meaning, phonetic, example] = match;
        const annoSpan = document.createElement('span');
        annoSpan.innerText = word;
        annoSpan.className = `word word-${type}`;
        annoSpan.dataset.startIndex = plainIndex;
        annoSpan.onclick = () => showAnnotation({ word, type, meaning, phonetic, example });
        reader.appendChild(annoSpan);
        wordSpans.push(annoSpan);
        plainIndex += word.length;

        lastIdx = regex.lastIndex;
      }

      // Remaining plain text
      if (lastIdx < raw.length) {
        const textChunk = raw.substring(lastIdx);
        const words = textChunk.split(/(\s+)/);
        words.forEach(w => {
          if (w.trim().length > 0) {
            const span = document.createElement('span');
            span.innerText = w;
            span.className = 'word';
            span.dataset.startIndex = plainIndex;
            reader.appendChild(span);
            wordSpans.push(span);
            plainIndex += w.length;
          } else if (w.length > 0) {
            reader.appendChild(document.createTextNode(w));
            plainIndex += w.length;
          }
        });
      }

      // Morale Box
      if (currentStory.morale) {
        const morale = document.createElement('div');
        morale.className = 'morale-box';
        morale.innerHTML = `💡 <b>Key Takeaway:</b> ${currentStory.morale}`;
        reader.appendChild(morale);
      }

      // Comprehension Quiz
      if (currentStory.quiz) {
        const quizCard = document.createElement('div');
        quizCard.className = 'quiz-card';
        quizCard.innerHTML = `<div class="quiz-title">📝 Comprehension Quiz</div>
                              <p style="font-size:13px; font-weight:700; margin-bottom:10px;">${currentStory.quiz.question}</p>`;
        
        currentStory.quiz.options.forEach((opt, idx) => {
          const btn = document.createElement('button');
          btn.className = 'quiz-opt';
          btn.innerText = opt;
          btn.onclick = () => {
            if (idx === currentStory.quiz.correct) {
              btn.className = 'quiz-opt correct';
              btn.innerHTML = `✅ ${opt} <br/><span style="font-size:11px; font-weight:normal;">${currentStory.quiz.explanation}</span>`;
            } else {
              btn.className = 'quiz-opt wrong';
              btn.innerText = `❌ ${opt}`;
            }
          };
          quizCard.appendChild(btn);
        });
        reader.appendChild(quizCard);
      }
    }

    // SPEECH AUDIO ENGINE
    function handlePlayToggle() {
      if (isPlaying) {
        stopAudio();
      } else {
        startAudio();
      }
    }

    function startAudio() {
      if (!('speechSynthesis' in window)) {
        alert("Text-to-Speech is not supported in your browser.");
        return;
      }

      window.speechSynthesis.cancel();
      const plainText = currentStory.text.replace(/\[([^|]+)\|[^\]]+\]/g, '$1');
      
      utterance = new SpeechSynthesisUtterance(plainText);
      utterance.rate = currentSpeed;
      utterance.lang = currentLang;

      utterance.onboundary = (e) => {
        if (e.name === 'word') {
          highlightWordAtCharIndex(e.charIndex);
          const progress = (e.charIndex / plainText.length) * 100;
          document.getElementById('progressBar').style.width = Math.min(progress, 100) + '%';
        }
      };

      utterance.onend = () => {
        stopAudio();
        document.getElementById('progressBar').style.width = '100%';
      };

      utterance.onerror = () => stopAudio();

      window.speechSynthesis.speak(utterance);
      isPlaying = true;
      document.getElementById('btnPlay').style.display = 'none';
      document.getElementById('btnStop').style.display = 'flex';
    }

    function stopAudio() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      isPlaying = false;
      document.getElementById('btnPlay').style.display = 'flex';
      document.getElementById('btnStop').style.display = 'none';
      document.getElementById('progressBar').style.width = '0%';
      clearHighlights();
    }

    function highlightWordAtCharIndex(index) {
      clearHighlights();
      for (let i = 0; i < wordSpans.length; i++) {
        const start = parseInt(wordSpans[i].dataset.startIndex);
        if (Math.abs(start - index) <= 3) {
          wordSpans[i].classList.add('reading-highlight');
          wordSpans[i].scrollIntoView({ behavior: 'smooth', block: 'center' });
          break;
        }
      }
    }

    function clearHighlights() {
      wordSpans.forEach(span => span.classList.remove('reading-highlight'));
    }

    function speakWord(word) {
      if (!('speechSynthesis' in window)) return;
      const u = new SpeechSynthesisUtterance(word);
      u.rate = 0.9;
      u.lang = currentLang;
      window.speechSynthesis.speak(u);
    }

    function changeSpeed(speed) {
      currentSpeed = parseFloat(speed);
      if (isPlaying) {
        startAudio();
      }
    }

    function changeVoice(lang) {
      currentLang = lang;
      if (isPlaying) {
        startAudio();
      }
    }

    // ANNOTATION DETAILS
    function showAnnotation(data) {
      currentAnnotation = data;
      document.getElementById('annoWord').innerText = data.word;
      
      const tag = document.getElementById('annoType');
      tag.innerText = data.type.toUpperCase();
      tag.className = `modal-tag ${data.type === 'vocab' ? 'badge-a2' : 'badge-b1'}`;
      
      document.getElementById('annoPhonetic').innerText = data.phonetic;
      document.getElementById('annoMeaning').innerText = data.meaning;
      document.getElementById('annoExample').innerText = `"${data.example}"`;
      document.getElementById('annotationSheet').style.display = 'flex';
    }

    // STORY HUB & OFFLINE CACHE
    function openStoryHub() {
      const list = document.getElementById('libraryList');
      list.innerHTML = "";

      activeStories.forEach((s, idx) => {
        const item = document.createElement('div');
        item.className = `lib-item ${s.id === currentStory.id ? 'active' : ''}`;
        item.innerHTML = `
          <div>
            <div style="font-weight:700; font-size:13px;">${s.title}</div>
            <div style="font-size:11px; color:var(--text-muted);">${s.level} • ${s.theme}</div>
          </div>
          <span style="font-size:10px; background:#10b981; color:white; padding:2px 6px; border-radius:10px; font-weight:bold;">Offline Ready</span>
        `;
        item.onclick = () => {
          currentStory = s;
          renderActiveStory();
          closeSheetDirect('librarySheet');
        };
        list.appendChild(item);
      });

      document.getElementById('librarySheet').style.display = 'flex';
    }

    // SHEET CLOSING & HELPERS
    function closeSheet(event, id) {
      if (event.target.id === id) {
        document.getElementById(id).style.display = 'none';
      }
    }

    function closeSheetDirect(id) {
      document.getElementById(id).style.display = 'none';
    }

    function cycleFontSize() {
      const reader = document.getElementById('readerArea');
      reader.classList.remove(fontSizes[currentFontIdx]);
      currentFontIdx = (currentFontIdx + 1) % fontSizes.length;
      reader.classList.add(fontSizes[currentFontIdx]);
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      document.documentElement.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
    }

    window.onload = initApp;
  </script>
</body>
</html>
