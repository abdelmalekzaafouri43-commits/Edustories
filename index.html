<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LingoStory - Language Learning Reader</title>
  <style>
    :root {
      --primary: #4338ca;
      --primary-dark: #312e81;
      --secondary: #0d9488;
      --sapphire: #1d4ed8;
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-variant: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;

      /* Grammar Tag Colors matching Theme.kt */
      --noun-bg: #fee2e2; --noun-text: #991b1b; --noun-border: #f87171;
      --tense-bg: #dbeafe; --tense-text: #1e40af; --tense-border: #60a5fa;
      --adj-bg: #fef3c7; --adj-text: #92400e; --adj-border: #fcd34d;
      --adv-bg: #e0e7ff; --adv-text: #3730a3; --adv-border: #818cf8;
      --prep-bg: #f3e8ff; --prep-text: #6b21a8; --prep-border: #c084fc;
      --conj-bg: #ffedd5; --conj-text: #9a3412; --conj-border: #fb923c;
      --struct-bg: #ccfbf1; --struct-text: #115e59; --struct-border: #2dd4bf;
      --lex-bg: #fef08a; --lex-text: #854d0e; --lex-border: #facc15;
      
      --reading-highlight: #fde047;
    }

    [data-theme="dark"] {
      --bg: #090d16;
      --surface: #131b2e;
      --surface-variant: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #26334d;

      --noun-bg: #450a0a; --noun-text: #fca5a5; --noun-border: #7f1d1d;
      --tense-bg: #172554; --tense-text: #93c5fd; --tense-border: #1e3a8a;
      --adj-bg: #451a03; --adj-text: #fde68a; --adj-border: #78350f;
      --adv-bg: #1e1b4b; --adv-text: #c7d2fe; --adv-border: #312e81;
      --prep-bg: #3b0764; --prep-text: #e9d5ff; --prep-border: #581c87;
      --conj-bg: #431407; --conj-text: #fed7aa; --conj-border: #7c2d12;
      --struct-bg: #042f2e; --struct-text: #99f6e4; --struct-border: #134e4a;
      --lex-bg: #422006; --lex-text: #fef08a; --lex-border: #713f12;
      
      --reading-highlight: #ca8a04;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; user-select: none; }

    /* TOP 25% SECTION */
    .top-section {
      height: 25vh;
      min-height: 165px;
      background: linear-gradient(135deg, #1e3a8a, #0f172a);
      color: #ffffff;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      z-index: 10;
      position: relative;
    }
    .top-bar { display: flex; justify-content: space-between; align-items: center; }
    .badge-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .badge { padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .badge-a2 { background: #10b981; color: #fff; }
    .badge-b1 { background: #3b82f6; color: #fff; }
    .badge-c1 { background: #8b5cf6; color: #fff; }
    .badge-theme { background: rgba(255,255,255,0.18); color: #fff; }

    .top-actions { display: flex; gap: 6px; align-items: center; }
    .icon-btn { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.18); border: none; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 13px; }
    .icon-btn:hover { background: rgba(255,255,255,0.3); }

    .title-box { margin-top: 2px; }
    .story-title { font-size: 1.22rem; font-weight: 800; line-height: 1.2; }
    .story-desc { font-size: 0.78rem; opacity: 0.85; margin-top: 2px; }

    .header-bottom { display: flex; justify-content: space-between; align-items: center; }
    .btn-pill { background: #ffffff; color: #1e3a8a; border: none; padding: 5px 12px; border-radius: 16px; font-weight: 700; font-size: 11px; cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .progress-track { width: 100%; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; overflow: hidden; margin-top: 4px; }
    .progress-fill { height: 100%; width: 0%; background: #38bdf8; transition: width 0.15s ease; }

    /* BOTTOM 75% SECTION */
    .bottom-section { height: 75vh; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }

    /* Audio Toolbar */
    .audio-toolbar {
      padding: 8px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
    }
    .btn-play { background: var(--primary); color: white; border: none; padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 5px; }
    .btn-stop { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 20px; font-weight: 700; font-size: 12px; cursor: pointer; display: none; }
    .pill-select { background: var(--surface-variant); border: 1px solid var(--border); color: var(--text-main); padding: 4px 8px; border-radius: 8px; font-size: 11px; font-weight: 600; cursor: pointer; }

    /* Grammar Filter Bar */
    .filter-bar {
      padding: 6px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      white-space: nowrap;
    }
    .filter-pill {
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 10.5px;
      font-weight: 700;
      border: 1px solid var(--border);
      background: var(--surface-variant);
      color: var(--text-muted);
      cursor: pointer;
    }
    .filter-pill.active { background: var(--primary); color: white; border-color: var(--primary); }

    /* Main Reader Area */
    .reader-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 60px 16px;
      line-height: 1.9;
    }
    .font-14 { font-size: 14px; line-height: 1.8; }
    .font-16 { font-size: 16px; line-height: 1.85; }
    .font-18 { font-size: 18px; line-height: 1.9; }
    .font-21 { font-size: 21px; line-height: 2.0; }
    .font-24 { font-size: 24px; line-height: 2.1; }

    /* Grammar Annotation Tags */
    .part { cursor: pointer; border-radius: 4px; padding: 1px 3px; margin: 0 1px; display: inline; transition: background 0.15s; }
    .part-noun { background: var(--noun-bg); color: var(--noun-text); border: 1px solid var(--noun-border); }
    .part-tense { background: var(--tense-bg); color: var(--tense-text); border: 1px solid var(--tense-border); font-weight: 600; }
    .part-adj { background: var(--adj-bg); color: var(--adj-text); border: 1px solid var(--adj-border); }
    .part-adv { background: var(--adv-bg); color: var(--adv-text); border: 1px solid var(--adv-border); }
    .part-prep { background: var(--prep-bg); color: var(--prep-text); border: 1px solid var(--prep-border); }
    .part-conj { background: var(--conj-bg); color: var(--conj-text); border: 1px solid var(--conj-border); }
    .part-struct { background: var(--struct-bg); color: var(--struct-text); border: 1px dashed var(--struct-border); }
    .part-lex { background: var(--lex-bg); color: var(--lex-text); border: 1.5px solid var(--lex-border); font-weight: 700; }

    .reading-active { background: var(--reading-highlight) !important; color: #000000 !important; border-radius: 4px; box-shadow: 0 0 6px var(--reading-highlight); }

    /* Pagination Bar */
    .pagination-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 16px 0 20px 0;
      padding: 8px 12px;
      background: var(--surface-variant);
      border-radius: 12px;
    }
    .page-btn { background: var(--primary); color: white; border: none; padding: 5px 12px; border-radius: 8px; font-weight: 700; font-size: 11px; cursor: pointer; }
    .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Comprehension Quiz */
    .quiz-container { margin-top: 24px; padding: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; }
    .quiz-head { font-weight: 800; font-size: 14px; color: var(--primary); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
    .quiz-item { margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
    .quiz-q { font-size: 13px; font-weight: 700; margin-bottom: 8px; }
    .quiz-opt { display: block; width: 100%; text-align: left; padding: 9px 12px; margin-bottom: 6px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-variant); color: var(--text-main); font-size: 12px; cursor: pointer; }
    .quiz-opt.correct { background: #dcfce7 !important; border-color: #22c55e !important; color: #15803d !important; font-weight: bold; }
    .quiz-opt.wrong { background: #fee2e2 !important; border-color: #ef4444 !important; color: #b91c1c !important; }
    .quiz-exp { font-size: 11px; margin-top: 4px; font-style: italic; color: var(--text-muted); }

    /* Modal Sheets */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; align-items: flex-end; z-index: 100; }
    .modal-sheet { width: 100%; max-height: 80vh; overflow-y: auto; background: var(--surface); border-top-left-radius: 20px; border-top-right-radius: 20px; padding: 20px 18px; box-shadow: 0 -8px 24px rgba(0,0,0,0.3); }
    .modal-head { display: flex; justify-content: space-between; align-items: center; }
    .modal-word { font-size: 1.4rem; font-weight: 800; color: var(--primary); }
    .modal-badge { display: inline-block; padding: 3px 8px; border-radius: 8px; font-size: 10px; font-weight: bold; margin-top: 4px; text-transform: uppercase; }
    .modal-desc { margin: 12px 0; font-size: 13.5px; line-height: 1.45; }
    .modal-ex { background: var(--surface-variant); padding: 10px; border-radius: 8px; font-style: italic; font-size: 12px; border-left: 3px solid var(--primary); margin-top: 8px; }
  </style>
</head>
<body>

  <!-- TOP 25% SECTION -->
  <div class="top-section">
    <div class="top-bar">
      <div class="badge-group">
        <span id="levelBadge" class="badge badge-a2">A2 Elementary</span>
        <span id="themeBadge" class="badge badge-theme">Travel</span>
      </div>
      <div class="top-actions">
        <button class="icon-btn" onclick="cycleFontSize()" title="Adjust Text Size">Aa</button>
        <button class="icon-btn" onclick="toggleTheme()" title="Toggle Dark/Light Mode">🌓</button>
      </div>
    </div>

    <div class="title-box">
      <h1 id="storyTitle" class="story-title">A First Journey to London</h1>
      <p id="storyThemeDesc" class="story-desc">Tom's first adventure exploring London</p>
    </div>

    <div>
      <div class="header-bottom">
        <button class="btn-pill" onclick="openStoryHub()">📚 Story Library (<span id="libCount">4</span>)</button>
        <span style="font-size: 10.5px; opacity: 0.85;">Tap highlighted tags for explanations</span>
      </div>
      <div class="progress-track">
        <div id="progressFill" class="progress-fill"></div>
      </div>
    </div>
  </div>

  <!-- BOTTOM 75% SECTION -->
  <div class="bottom-section">
    <!-- Audio Toolbar -->
    <div class="audio-toolbar">
      <div style="display:flex; gap:6px; align-items:center;">
        <button id="btnPlay" class="btn-play" onclick="toggleAudio()">▶ Read Aloud</button>
        <button id="btnStop" class="btn-stop" onclick="stopAudio()">⏹ Stop</button>
      </div>
      
      <div style="display:flex; gap:6px; align-items:center;">
        <select id="accentSelect" class="pill-select" onchange="changeAccent(this.value)">
          <option value="en-US">🇺🇸 US Native</option>
          <option value="en-GB">🇬🇧 UK English</option>
        </select>
        <select id="speedSelect" class="pill-select" onchange="changeSpeed(this.value)">
          <option value="0.8">0.8x</option>
          <option value="1.0" selected>1.0x</option>
          <option value="1.2">1.2x</option>
        </select>
      </div>
    </div>

    <!-- Grammar Category Filter Bar -->
    <div class="filter-bar">
      <button class="filter-pill active" onclick="setGrammarFilter(null, this)">All Tags</button>
      <button class="filter-pill" onclick="setGrammarFilter('N', this)">Nouns</button>
      <button class="filter-pill" onclick="setGrammarFilter('T', this)">Tenses</button>
      <button class="filter-pill" onclick="setGrammarFilter('L', this)">Vocab</button>
      <button class="filter-pill" onclick="setGrammarFilter('ADJ', this)">Adjectives</button>
      <button class="filter-pill" onclick="setGrammarFilter('ADV', this)">Adverbs</button>
      <button class="filter-pill" onclick="setGrammarFilter('P', this)">Prepositions</button>
      <button class="filter-pill" onclick="setGrammarFilter('C', this)">Conjunctions</button>
      <button class="filter-pill" onclick="setGrammarFilter('S', this)">Structures</button>
    </div>

    <!-- Main Reader Area -->
    <div id="readerArea" class="reader-scroll font-16">
      <div id="storyContent"></div>
      
      <!-- Book Pagination Controls -->
      <div class="pagination-bar">
        <button id="prevPageBtn" class="page-btn" onclick="prevPage()">◀ Previous</button>
        <span id="pageIndicator" style="font-size:11.5px; font-weight:700;">Page 1 of 2</span>
        <button id="nextPageBtn" class="page-btn" onclick="nextPage()">Next ▶</button>
      </div>

      <!-- Interactive Quizzes -->
      <div id="quizArea" class="quiz-container"></div>
    </div>
  </div>

  <!-- Annotation Detail Sheet -->
  <div id="annotationModal" class="modal-overlay" onclick="closeSheet(event, 'annotationModal')">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div class="modal-head">
        <div>
          <div id="sheetWord" class="modal-word">Word</div>
          <span id="sheetBadge" class="modal-badge badge-a2">TAG</span>
        </div>
        <button class="icon-btn" style="background:var(--primary); color:white;" onclick="speakWord(currentAnnotationWord)">🔊</button>
      </div>
      <div id="sheetTypeTitle" style="font-size:12px; font-weight:bold; color:var(--text-muted); margin-top:4px;">Grammar Category</div>
      <div id="sheetDesc" class="modal-desc">Explanation and rules.</div>
      <div id="sheetEx" class="modal-ex">Example Sentence</div>
      <button class="btn-play" style="width:100%; margin-top:14px; justify-content:center;" onclick="closeModalDirect('annotationModal')">Got it</button>
    </div>
  </div>

  <!-- Story Library Hub Modal -->
  <div id="libraryModal" class="modal-overlay" onclick="closeSheet(event, 'libraryModal')">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <h2 style="font-size:1.15rem; margin-bottom:12px; color:var(--primary);">📚 Story Library & Offline Cache</h2>
      <div id="libraryList"></div>
      <button class="btn-play" style="width:100%; margin-top:14px; justify-content:center;" onclick="closeModalDirect('libraryModal')">Close</button>
    </div>
  </div>

  <script>
    // All 4 Complete Presets exactly from PresetStories.kt
    const fullStoryData = [
      {
        id: "travel_a2_1",
        title: "A First Journey to London",
        level: "A2",
        theme: "Travel",
        description: "Tom's first adventure exploring London",
        raw: "[N:Tom](Subject Noun - Main traveler) [T:wakes up](Present Simple - Routine & habit) [ADV:early](Adverb of Time - Modifies 'wakes up') today [C:because](Subordinating Conjunction - Explains cause) it is his [ADJ:first](Ordinal Adjective - Modifies 'day') day in [N:London](Proper Noun - Destination city). He [T:feels](Present Simple - Stative verb of emotion) a bit [L:nervous](Anxious or worried - A2) about navigating the underground, [C:but](Coordinating Conjunction - Shows contrast) his [N:enthusiasm](Abstract Noun - Key motivation) keeps him going. After a [L:hearty](Substantial and satisfying - A2) [N:breakfast](Concrete Noun - Morning meal) at a [ADJ:cozy](Descriptive Adjective - Warm & comfortable) local cafe, he decides to visit Big Ben. [S:Relative Clause:While he is waiting for the bus](Dependent temporal clause describing simultaneous actions), an [ADJ:elderly](Descriptive Adjective - Modifies 'lady') lady [ADV:kindly](Adverb of Manner - Modifies 'offers') offers directions. She [T:explains](Present Simple - General truth) the city route with great detail. Tom thanks her [ADV:warmly](Adverb of Manner - Expressing gratitude) [C:and](Coordinating Conjunction - Connects actions) walks [P:towards](Preposition of Direction - Indicates movement to destination) the station. He feels [L:confident](Feeling sure of oneself - A2) that this trip will be unforgettable.",
        quiz: [
          { question: "Why does Tom wake up early?", options: ["Because he has a flight to catch", "Because it is his first day in London", "Because his alarm rings continuously"], correct: 1, explanation: "The text states: 'Tom wakes up early today because it is his first day in London.'" },
          { question: "What part of speech is 'warmly' in 'Tom thanks her warmly'?", options: ["Adverb of Manner", "Proper Noun", "Conjunction"], correct: 0, explanation: "'warmly' is an Adverb of Manner describing how Tom thanks the lady." },
          { question: "What sentence structure is 'While he is waiting for the bus'?", options: ["Independent clause", "Dependent temporal clause / Relative Clause", "Passive voice construction"], correct: 1, explanation: "'While he is waiting for the bus' is a dependent temporal clause showing simultaneous action." }
        ]
      },
      {
        id: "work_b1_1",
        title: "The Morning Pitch Presentation",
        level: "B1",
        theme: "Work & Career",
        description: "Sarah's executive pitch presentation",
        raw: "[N:Sarah](Subject Noun - Lead presenter) [T:has been rehearsing](Present Perfect Continuous - Action started in past and ongoing) her slides all night [C:so that](Subordinating Conjunction - Expresses purpose) she can deliver a [ADJ:flawless](Descriptive Adjective - Perfect & without defect) pitch [P:to](Preposition of Direction - Recipient of pitch) the executive board. Although she felt slightly [L:overwhelmed](Feeling burdened by intense responsibility - B1) by the [ADJ:strict](Descriptive Adjective - Stringent & demanding) deadline, her [N:team](Collective Noun - Project colleagues) provided invaluable research. [S:Conditional Clause:In order to engage her audience](Infinitive subordinate purpose structure), she begins her presentation with a [ADJ:compelling](Descriptive Adjective - Fascinating & persuasive) case study. The board members [T:nodded](Past Simple - Completed past reaction) [ADV:attentively](Adverb of Manner - Listening with close attention) throughout her talk. [C:Furthermore](Transitional Connector - Adds supporting information), the chief executive asked several [ADJ:thoughtful](Descriptive Adjective - Reflective & deep) questions. Sarah answered each inquiry with [L:poise](Calm dignity and self-assurance - B1) and conviction, [S:Participial Clause:securing the contract successfully](Participial clause describing resulting success).",
        quiz: [
          { question: "Why did Sarah rehearse her slides all night?", options: ["To study for an exam", "So that she could deliver a flawless pitch", "To write a report"], correct: 1, explanation: "The text states 'Sarah has been rehearsing her slides all night so that she can deliver a flawless pitch'." },
          { question: "What does the target vocabulary 'poise' mean?", options: ["Sudden panic", "Calm dignity and self-assurance", "Hesitation"], correct: 1, explanation: "'Poise' refers to maintaining calm dignity and composure." },
          { question: "What verb tense is 'has been rehearsing'?", options: ["Present Perfect Continuous", "Past Simple", "Future Perfect"], correct: 0, explanation: "'has been rehearsing' is Present Perfect Continuous." }
        ]
      },
      {
        id: "tech_c1_1",
        title: "Ethics in the Age of Synthetic Intelligence",
        level: "C1",
        theme: "Technology & AI",
        description: "Ethical research in neural intelligence",
        raw: "As algorithmic models become increasingly [L:ubiquitous](Present or found everywhere - C1) across society, [N:scientists](Subject Noun - Researchers) must scrutinize their [ADJ:societal](Classifying Adjective - Relating to society) impact. [N:Dr. Aris](Proper Noun - Lead researcher) [T:had anticipated](Past Perfect - Action completed prior to another past milestone) these [ADJ:ethical](Descriptive Adjective - Moral principles) dilemmas [P:before](Preposition of Time - Preceding event) automated frameworks dominated healthcare. [C:Notwithstanding](Prepositional Connector - In spite of / Despite - C1) [ADJ:initial](Descriptive Adjective - Early stage) resistance from industry executives, his [ADJ:pioneering](Descriptive Adjective - Groundbreaking & novel) research forced policymakers to institute [ADJ:rigorous](Descriptive Adjective - Strict & meticulous) safeguards. [C:Whereas](Subordinating Conjunction - Introduces direct contrast) past shifts primarily impacted manual labor, cognitive automation [ADV:directly](Adverb of Degree/Manner - Modifies 'alters') alters creative industries. Consequently, engineers [T:are striving](Present Continuous - Active ongoing endeavor) to design [ADJ:transparent](Descriptive Adjective - Clear and understandable) systems [C:lest](Conjunction - For fear that / To prevent risk - C1) biased data corrupt democratic decision-making.",
        quiz: [
          { question: "What does 'ubiquitous' mean?", options: ["Rare and difficult to find", "Present or found everywhere", "Highly unstable"], correct: 1, explanation: "'Ubiquitous' describes something existing or being everywhere at once." },
          { question: "Why is 'had anticipated' conjugated in the Past Perfect?", options: ["Routine action", "Action completed prior to another past event", "Future prediction"], correct: 1, explanation: "Past Perfect indicates Dr. Aris foresaw the issues before automation dominated." },
          { question: "What is the role of 'lest'?", options: ["To prevent a potential negative outcome", "To summarize", "To ask a question"], correct: 0, explanation: "'lest' means 'for fear that' or 'to prevent the risk that'." }
        ]
      },
      {
        id: "daily_a2_1",
        title: "A Quiet Sunday Afternoon",
        level: "A2",
        theme: "Daily Life",
        description: "Emma's relaxing Sunday routine",
        raw: "[N:Emma](Subject Noun - Main protagonist) [T:enjoys](Present Simple - Habitual preference) spending her Sundays [P:at](Preposition of Place - Location) home [C:because](Subordinating Conjunction - Explains reason) the weekday commute is [ADJ:exhausting](Descriptive Adjective - Tiring & draining). She [T:is brewing](Present Continuous - Action happening right now) [ADJ:fresh](Descriptive Adjective - Newly prepared) lavender tea [S:Temporal Clause:while her cat sleeps peacefully](Subordinate temporal clause describing background action). [C:Although](Subordinating Conjunction - Expresses concession/contrast) rain is falling outside, her apartment feels [ADJ:cozy](Descriptive Adjective - Comfortable & warm). She reads a chapter [P:of](Preposition of Possession/Specification) her favorite book [C:before](Prepositional Conjunction - Preceding event) preparing a [ADJ:delicious](Descriptive Adjective - Highly tasty) soup for dinner. This [ADJ:quiet](Descriptive Adjective - Peaceful & calm) routine helps her stay [L:refreshed](Restored in energy and vitality - A2) for the upcoming week.",
        quiz: [
          { question: "What is Emma doing while her cat sleeps?", options: ["Driving to work", "Brewing fresh lavender tea", "Shopping"], correct: 1, explanation: "The story states: 'She is brewing fresh lavender tea while her cat sleeps'." },
          { question: "What part of speech is 'fresh'?", options: ["Descriptive Adjective", "Verb Tense", "Preposition"], correct: 0, explanation: "'fresh' is an adjective modifying lavender tea." },
          { question: "Which tense is used in 'She is brewing'?", options: ["Present Continuous", "Future Simple", "Past Simple"], correct: 0, explanation: "'is brewing' is in the Present Continuous tense." }
        ]
      }
    ];

    // State Variables
    let currentStory = fullStoryData[0];
    let parsedTokens = [];
    let pages = [];
    let currentPage = 0;
    let activeFilter = null;
    let currentFontSizeIdx = 1;
    const fontSizes = ['font-14', 'font-16', 'font-18', 'font-21', 'font-24'];
    let isSpeaking = false;
    let currentSpeed = 1.0;
    let currentAccent = 'en-US';
    let utterance = null;
    let currentAnnotationWord = "";

    function init() {
      loadStory(currentStory);
      document.getElementById('libCount').innerText = fullStoryData.length;
    }

    function loadStory(story) {
      currentStory = story;
      document.getElementById('storyTitle').innerText = story.title;
      document.getElementById('storyThemeDesc').innerText = story.description;
      
      const badge = document.getElementById('levelBadge');
      badge.innerText = story.level + " Level";
      badge.className = `badge badge-${story.level.toLowerCase()}`;
      document.getElementById('themeBadge').innerText = story.theme;

      parseStoryMarkup(story.raw);
      paginateStory();
      renderPage(0);
      renderQuiz();
      stopAudio();
    }

    // Parses [TYPE:word](info) or [S:type:clause](info)
    function parseStoryMarkup(rawText) {
      parsedTokens = [];
      const regex = /\[(L|T|C|N|ADJ|ADV|P|S)(?::([^:\]]+))?(?::([^\]]+))?\]\(([^)]+)\)/g;
      let lastIndex = 0;
      let match;
      let charIdx = 0;

      while ((match = regex.exec(rawText)) !== null) {
        if (match.index > lastIndex) {
          const plain = rawText.substring(lastIndex, match.index);
          plain.split(/(\s+)/).filter(Boolean).forEach(w => {
            parsedTokens.push({ type: 'TEXT', text: w, charStart: charIdx, charEnd: charIdx + w.length });
            charIdx += w.length;
          });
        }

        const [_, tagType, p1, p2, info] = match;
        const word = (p2 && p2.trim()) ? p2.trim() : (p1 ? p1.trim() : "");
        const extra = (p2 && p2.trim()) ? p1.trim() : "";
        
        parsedTokens.push({
          type: tagType,
          text: word,
          info: info.trim(),
          extra: extra,
          charStart: charIdx,
          charEnd: charIdx + word.length
        });
        charIdx += word.length;
        lastIndex = regex.lastIndex;
      }

      if (lastIndex < rawText.length) {
        const plain = rawText.substring(lastIndex);
        plain.split(/(\s+)/).filter(Boolean).forEach(w => {
          parsedTokens.push({ type: 'TEXT', text: w, charStart: charIdx, charEnd: charIdx + w.length });
          charIdx += w.length;
        });
      }
    }

    function paginateStory() {
      pages = [];
      const mid = Math.ceil(parsedTokens.length / 2);
      pages.push(parsedTokens.slice(0, mid));
      pages.push(parsedTokens.slice(mid));
    }

    function renderPage(pageIdx) {
      currentPage = pageIdx;
      document.getElementById('pageIndicator').innerText = `Page ${currentPage + 1} of ${pages.length}`;
      document.getElementById('prevPageBtn').disabled = (currentPage === 0);
      document.getElementById('nextPageBtn').disabled = (currentPage === pages.length - 1);

      const content = document.getElementById('storyContent');
      content.innerHTML = "";

      const currentTokens = pages[currentPage] || [];
      currentTokens.forEach((token) => {
        if (token.type === 'TEXT') {
          content.appendChild(document.createTextNode(token.text));
        } else {
          const span = document.createElement('span');
          span.innerText = token.text;
          span.className = `part part-${token.type.toLowerCase()}`;
          span.dataset.start = token.charStart;
          
          if (activeFilter && activeFilter !== token.type) {
            span.style.opacity = "0.35";
          } else {
            span.style.opacity = "1";
          }

          span.onclick = () => showAnnotationModal(token);
          content.appendChild(span);
        }
      });
    }

    function prevPage() { if (currentPage > 0) renderPage(currentPage - 1); }
    function nextPage() { if (currentPage < pages.length - 1) renderPage(currentPage + 1); }

    function setGrammarFilter(type, btn) {
      activeFilter = type;
      document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      renderPage(currentPage);
    }

    function showAnnotationModal(token) {
      currentAnnotationWord = token.text;
      document.getElementById('sheetWord').innerText = token.text;
      
      const tagLabels = {
        'N': 'Noun / Subject',
        'T': 'Verb Tense',
        'L': 'Vocabulary & Lexicon',
        'ADJ': 'Adjective',
        'ADV': 'Adverb',
        'P': 'Preposition',
        'C': 'Conjunction',
        'S': token.extra ? token.extra : 'Sentence Structure'
      };

      document.getElementById('sheetTypeTitle').innerText = tagLabels[token.type] || 'Grammar';
      document.getElementById('sheetBadge').innerText = token.type;
      document.getElementById('sheetBadge').className = `modal-badge badge-${currentStory.level.toLowerCase()}`;
      document.getElementById('sheetDesc').innerText = token.info;
      document.getElementById('sheetEx').innerText = `Story context: "${token.text}" in ${currentStory.title}`;
      document.getElementById('annotationModal').style.display = 'flex';
    }

    function renderQuiz() {
      const qArea = document.getElementById('quizArea');
      qArea.innerHTML = `<div class="quiz-head">📝 Comprehension & Grammar Quiz</div>`;

      currentStory.quiz.forEach((q, idx) => {
        const item = document.createElement('div');
        item.className = 'quiz-item';
        item.innerHTML = `<div class="quiz-q">${idx + 1}. ${q.question}</div>`;

        q.options.forEach((opt, optIdx) => {
          const btn = document.createElement('button');
          btn.className = 'quiz-opt';
          btn.innerText = opt;
          btn.onclick = () => {
            if (optIdx === q.correct) {
              btn.className = 'quiz-opt correct';
              btn.innerHTML = `✅ ${opt} <div class="quiz-exp">${q.explanation}</div>`;
            } else {
              btn.className = 'quiz-opt wrong';
              btn.innerText = `❌ ${opt}`;
            }
          };
          item.appendChild(btn);
        });
        qArea.appendChild(item);
      });
    }

    // AUDIO PLAYBACK & WORD SYNC
    function toggleAudio() {
      if (isSpeaking) {
        stopAudio();
      } else {
        startAudio();
      }
    }

    function startAudio() {
      if (!('speechSynthesis' in window)) return alert('TTS not supported');
      window.speechSynthesis.cancel();

      const plain = currentStory.raw.replace(/\[(?:[A-Z]+)(?::([^:\]]+))?(?::([^\]]+))?\]\(([^)]+)\)/g, (m, p1, p2) => (p2 && p2.trim()) ? p2.trim() : (p1 ? p1.trim() : ''));
      utterance = new SpeechSynthesisUtterance(plain);
      utterance.rate = currentSpeed;
      utterance.lang = currentAccent;

      utterance.onboundary = (e) => {
        if (e.name === 'word') {
          const progress = (e.charIndex / plain.length) * 100;
          document.getElementById('progressFill').style.width = Math.min(progress, 100) + "%";
          highlightActiveWord(e.charIndex);
        }
      };

      utterance.onend = () => stopAudio();
      utterance.onerror = () => stopAudio();

      window.speechSynthesis.speak(utterance);
      isSpeaking = true;
      document.getElementById('btnPlay').style.display = 'none';
      document.getElementById('btnStop').style.display = 'flex';
    }

    function stopAudio() {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      isSpeaking = false;
      document.getElementById('btnPlay').style.display = 'flex';
      document.getElementById('btnStop').style.display = 'none';
      document.getElementById('progressFill').style.width = '0%';
      clearHighlights();
    }

    function highlightActiveWord(charIndex) {
      clearHighlights();
      const spans = document.querySelectorAll('.part');
      spans.forEach(s => {
        const start = parseInt(s.dataset.start || 0);
        if (Math.abs(start - charIndex) <= 4) {
          s.classList.add('reading-active');
        }
      });
    }

    function clearHighlights() {
      document.querySelectorAll('.part').forEach(s => s.classList.remove('reading-active'));
    }

    function speakWord(w) {
      if (!('speechSynthesis' in window)) return;
      const u = new SpeechSynthesisUtterance(w);
      u.rate = 0.9;
      u.lang = currentAccent;
      window.speechSynthesis.speak(u);
    }

    function changeSpeed(val) { currentSpeed = parseFloat(val); if (isSpeaking) startAudio(); }
    function changeAccent(val) { currentAccent = val; if (isSpeaking) startAudio(); }

    function openStoryHub() {
      const list = document.getElementById('libraryList');
      list.innerHTML = "";
      fullStoryData.forEach((s) => {
        const item = document.createElement('div');
        item.style = `padding:10px 12px; margin-bottom:8px; border-radius:10px; border:1px solid var(--border); background:${s.id === currentStory.id ? 'rgba(67,56,202,0.15)' : 'var(--surface-variant)'}; cursor:pointer; display:flex; justify-content:space-between; align-items:center;`;
        item.innerHTML = `
          <div>
            <div style="font-weight:700; font-size:13px;">${s.title}</div>
            <div style="font-size:11px; color:var(--text-muted);">${s.level} • ${s.theme}</div>
          </div>
          <span style="font-size:10px; background:#10b981; color:white; padding:2px 6px; border-radius:8px; font-weight:bold;">Offline Ready</span>
        `;
        item.onclick = () => { loadStory(s); closeModalDirect('libraryModal'); };
        list.appendChild(item);
      });
      document.getElementById('libraryModal').style.display = 'flex';
    }

    function cycleFontSize() {
      const area = document.getElementById('readerArea');
      area.classList.remove(fontSizes[currentFontSizeIdx]);
      currentFontSizeIdx = (currentFontSizeIdx + 1) % fontSizes.length;
      area.classList.add(fontSizes[currentFontSizeIdx]);
    }

    function toggleTheme() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
    }

    function closeSheet(e, id) { if (e.target.id === id) closeModalDirect(id); }
    function closeModalDirect(id) { document.getElementById(id).style.display = 'none'; }

    window.onload = init;
  </script>
</body>
</html>
